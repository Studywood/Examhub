<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abhi Sir Mock Tests</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script async defer src="https://accounts.google.com/gsi/client"></script>
<style>
:root{--ink:#0f1f3d;--bg:#f3f6fb;--card:#fff;--line:#d9e1ee;--blue:#1d4ed8;--mut:#5b6b86;--ok:#15803d;--bad:#b91c1c;--amb:#d97706}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:0 14px 60px}
.bar{background:var(--ink);color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.bar b{font-size:17px}.bar small{opacity:.7;display:block}
h1{font-size:30px;line-height:1.15;margin:34px 0 6px}h2{font-size:19px;margin:26px 0 10px}
.mut{color:var(--mut)}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 14px;background:var(--blue);color:#fff;cursor:pointer}
button.g{background:#e6ecf7;color:var(--ink)}button.r{background:#fde8e8;color:var(--bad)}button.s{padding:5px 10px;font-size:14px}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}label.f{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input[type=checkbox]{width:20px;height:20px;accent-color:#1d4ed8;vertical-align:middle;margin-right:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cls{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 10px;font-size:20px;font-weight:700;text-align:center;cursor:pointer}
.cls:hover{border-color:var(--blue)}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>.grow{flex:1;min-width:140px}
.err{color:var(--bad);min-height:22px;font-size:14px}
.qt{white-space:pre-wrap;font-size:18px;margin:6px 0}.q img,.opt img,.pv img{max-width:100%;max-height:300px;display:block;margin:6px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;margin:8px 0;cursor:pointer}
.opt i{font-style:normal;font-weight:700;width:26px;height:26px;border-radius:50%;background:#e6ecf7;display:grid;place-items:center;flex:none}
.opt.on{border-color:var(--blue);background:#eef3ff}.opt.on i{background:var(--blue);color:#fff}
.opt.ok{border-color:var(--ok);background:#ecfdf3}.opt.no{border-color:var(--bad);background:#fef2f2}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:10px}
.pal button{padding:8px 0;background:#e6ecf7;color:var(--ink)}.pal .a{background:var(--ok);color:#fff}.pal .m{background:var(--amb);color:#fff}.pal .c{outline:3px solid var(--blue)}
.timer{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700}
.score{font-size:46px;font-weight:800}.pv{font-size:15px;color:var(--mut);white-space:pre-wrap}
</style></head>
<body><div id="app"></div>
<script>
const CFG={ADMIN:'abhi sir',HASH:'c9c5fd7c1fa9e1094b28814bb9b782ba1f52226b39b09ad9dfb9031e3923af86',GID:'',INDEX:'subjects.json'};
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)),del:k=>localStorage.removeItem(k)};
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const h=(t,p={},...c)=>{const e=document.createElement(t);for(const k in p){if(k.startsWith('on')||['value','checked','selected'].includes(k))e[k]=p[k];else if(k=='class')e.className=p[k];else e.setAttribute(k,p[k])}c.flat(9).forEach(x=>{if(x&&x.nodeType)e.append(x);else if(x!=null&&x!==false)e.append(String(x))});return e};
const S={cls:null,user:null,cat:{classes:[]},files:{},del:[]};
const DEF=[6,7,8,9,10,11,12].map(n=>({id:''+n,name:'Class '+n,subjects:[]}));
const mj=el=>window.renderMathInElement&&renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false});
const root=document.getElementById('app');
const go=v=>{clearInterval(S.tm);root.replaceChildren(v);scrollTo(0,0);mj(root)};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const dl=(name,text)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name.split('/').pop();a.click()};

async function init(){
  try{S.cat=await (await fetch(CFG.INDEX+'?v='+Date.now())).json()}catch{S.cat={classes:DEF}}
  if(!S.cat.classes||!S.cat.classes.length)S.cat.classes=DEF;
  const s=LS.get('sess')||JSON.parse(sessionStorage.getItem('sess')||'null');
  if(s){S.user=s;S.cls=s.cls||S.cat.classes[0].id;dash()}else pickClass();
}
const top=(sub)=>h('div',{class:'bar'},h('div',{},h('b',{},'ABHI SIR NOTES'),h('small',{},sub)),h('button',{class:'g s',onclick:()=>{LS.del('sess');sessionStorage.removeItem('sess');S.user=null;pickClass()}},'Log out'));

function pickClass(){
  go(h('div',{},h('div',{class:'bar'},h('b',{},'ABHI SIR NOTES')),h('div',{class:'wrap'},
    h('h1',{},'Choose your class'),h('p',{class:'mut'},'Pick a class to see its mock tests.'),
    h('div',{class:'grid'},S.cat.classes.map(c=>h('div',{class:'cls',onclick:()=>{S.cls=c.id;auth('login')}},c.name))),
    h('p',{},h('button',{class:'g s',onclick:()=>{S.cls=null;auth('login',true)}},'Admin login')))));
}

function auth(mode,adm){
  const rem=LS.get('rem',{}),err=h('div',{class:'err'}),n=h('input',{value:rem.n||'',placeholder:adm?'Admin name':'Your name',autocomplete:'username'}),
  p=h('input',{type:'password',value:rem.p||'',placeholder:'Password',autocomplete:'current-password'}),r=h('input',{type:'checkbox',checked:!!rem.n});
  const cname=(S.cat.classes.find(c=>c.id==S.cls)||{}).name;
  go(h('div',{},h('div',{class:'bar'},h('b',{},'ABHI SIR NOTES'),h('button',{class:'g s',onclick:pickClass},'Back')),h('div',{class:'wrap'},
    h('h1',{},adm?'Admin login':(mode=='login'?'Log in':'Sign up')+' · '+cname),
    !adm&&h('div',{class:'tabs'},h('button',{class:mode=='login'?'':'g',onclick:()=>auth('login')},'Log in'),h('button',{class:mode=='signup'?'':'g',onclick:()=>auth('signup')},'Sign up')),
    h('div',{class:'box'},h('label',{class:'f'},'Name'),n,h('label',{class:'f'},'Password'),p,
      h('p',{},h('label',{},r,'Remember me')),err,
      h('button',{onclick:async()=>{err.textContent='';const m=await sign(mode,n.value,p.value,r.checked);if(m)err.textContent=m}},mode=='login'?'Log in':'Create account'),
      !adm&&CFG.GID&&h('div',{id:'gb',style:'margin-top:14px'})))));
  if(!adm&&CFG.GID)setTimeout(gInit,700);
}
async function sign(mode,name,pw,rem){
  const key=name.trim().toLowerCase();if(!key||!pw)return 'Enter your name and password.';
  const hash=await sha(pw);let u;
  if(key==CFG.ADMIN){if(hash!=CFG.HASH)return 'Wrong admin password.';u={name:name.trim(),admin:true}}
  else{const us=LS.get('users',{});
    if(mode=='signup'){if(!S.cls)return 'Go back and choose a class first.';if(pw.length<4)return 'Use at least 4 characters.';if(us[key])return 'This name is taken. Log in instead.';us[key]={name:name.trim(),hash,cls:S.cls};LS.set('users',us);u={name:name.trim(),cls:S.cls}}
    else{if(!us[key]||us[key].hash!=hash)return 'Wrong name or password.';u={name:us[key].name,cls:S.cls||us[key].cls}}}
  rem?LS.set('rem',{n:name,p:pw}):LS.del('rem');
  login(u,rem);
}
function login(u,keep){S.user=u;if(u.cls)S.cls=u.cls;keep?LS.set('sess',u):sessionStorage.setItem('sess',JSON.stringify(u));dash()}
function gInit(){if(!window.google||!document.getElementById('gb'))return;
  google.accounts.id.initialize({client_id:CFG.GID,callback:r=>{const j=JSON.parse(decodeURIComponent(escape(atob(r.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))));login({name:j.name,email:j.email,cls:S.cls},true)}});
  google.accounts.id.renderButton(document.getElementById('gb'),{theme:'outline',size:'large'})}

function dash(){
  if(S.user.admin)return admin();
  const c=S.cat.classes.find(x=>x.id==S.cls)||S.cat.classes[0],res=LS.get('res_'+S.user.name,{});
  go(h('div',{},top(S.user.name+' · '+c.name),h('div',{class:'wrap'},
    !c.subjects.length&&h('h2',{},'No tests yet. Check back soon.'),
    c.subjects.map(s=>h('section',{},h('h2',{},s.name),s.tests.map(t=>h('div',{class:'box row'},
      h('div',{class:'grow'},h('b',{},t.title),h('div',{class:'mut'},t.duration+' min'+(res[t.id]?' · last score '+res[t.id].score+'/'+res[t.id].max:''))),
      h('button',{onclick:()=>start(t)},res[t.id]?'Retake':'Start')))))
  )));
}

/* ---------- test runner ---------- */
async function start(t){
  let T;try{T=S.files[t.file]?JSON.parse(S.files[t.file]):await (await fetch(t.file)).json()}catch{return alert('Could not load this test. Ask the admin to check the file.')}
  const A={T,t,i:0,ans:T.questions.map(()=>-1),mk:T.questions.map(()=>0),end:Date.now()+t.duration*60000};
  const paint=()=>{const q=T.questions[A.i],tm=h('span',{class:'timer',id:'tm'});
    go(h('div',{},h('div',{class:'bar'},h('div',{},h('b',{},t.title),h('small',{},'Question '+(A.i+1)+' of '+T.questions.length)),tm,h('button',{class:'s',onclick:()=>{if(confirm('Submit the test now?'))finish(A)}},'Submit')),
      h('div',{class:'wrap q'},h('div',{class:'qt'},q.q),q.qi&&h('img',{src:q.qi}),
        q.o.map((o,k)=>h('div',{class:'opt'+(A.ans[A.i]==k?' on':''),onclick:()=>{A.ans[A.i]=k;paint()}},h('i',{},'ABCD'[k]),h('div',{},o,q.oi&&q.oi[k]&&h('img',{src:q.oi[k]})))),
        h('div',{class:'row'},h('button',{class:'g',onclick:()=>{A.i=Math.max(0,A.i-1);paint()}},'Previous'),
          h('button',{class:'g',onclick:()=>{A.ans[A.i]=-1;paint()}},'Clear'),
          h('button',{class:'g',onclick:()=>{A.mk[A.i]^=1;paint()}},A.mk[A.i]?'Unmark':'Mark for review'),
          h('button',{onclick:()=>{A.i=Math.min(T.questions.length-1,A.i+1);paint()}},'Next')),
        h('div',{class:'pal'},T.questions.map((_,k)=>h('button',{class:(A.mk[k]?'m':A.ans[k]>=0?'a':'')+(k==A.i?' c':''),onclick:()=>{A.i=k;paint()}},k+1))))));
    tick();clearInterval(S.tm);S.tm=setInterval(tick,1000)};
  const tick=()=>{const s=Math.max(0,Math.round((A.end-Date.now())/1000)),e=document.getElementById('tm');if(e)e.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(!s){clearInterval(S.tm);finish(A)}};
  paint();
}
function finish(A){
  clearInterval(S.tm);const T=A.T,m=T.marks||4,ng=T.neg||0;let c=0,w=0;
  T.questions.forEach((q,k)=>{if(A.ans[k]>=0)A.ans[k]==q.a?c++:w++});
  const score=c*m-w*ng,max=T.questions.length*m;
  if(!S.user.admin){const r=LS.get('res_'+S.user.name,{});r[A.t.id]={score,max};LS.set('res_'+S.user.name,r)}
  go(h('div',{},top('Result'),h('div',{class:'wrap'},h('h2',{},A.t.title),
    h('div',{class:'box'},h('div',{class:'score'},score+' / '+max),h('div',{class:'mut'},c+' correct · '+w+' wrong · '+(T.questions.length-c-w)+' skipped'+(ng?' · −'+ng+' per wrong answer':''))),
    h('button',{onclick:dash},'Back to dashboard'),h('h2',{},'Review'),
    T.questions.map((q,k)=>h('div',{class:'box q'},h('b',{},'Q'+(k+1)),h('div',{class:'qt'},q.q),q.qi&&h('img',{src:q.qi}),
      q.o.map((o,j)=>h('div',{class:'opt'+(j==q.a?' ok':A.ans[k]==j?' no':'')},h('i',{},'ABCD'[j]),h('div',{},o,q.oi&&q.oi[j]&&h('img',{src:q.oi[j]}))))))
  )));
}

/* ---------- admin ---------- */
const allTests=()=>S.cat.classes.flatMap(c=>c.subjects.flatMap(s=>s.tests.map(t=>({c,s,t}))));
function admin(){
  const g=LS.get('gh',{}),sv=(k,el)=>el.oninput=()=>{const x=LS.get('gh',{});x[k]=el.value.trim();LS.set('gh',x)};
  const f=(k,ph,type)=>{const e=h('input',{placeholder:ph,type:type||'text',value:g[k]||''});sv(k,e);return h('div',{class:'grow'},e)};
  const pend=Object.keys(S.files).length+S.del.length+(S.dirty?1:0);
  go(h('div',{},top('Admin panel'),h('div',{class:'wrap'},
    h('h2',{},'Publish to GitHub'),
    h('div',{class:'box'},h('div',{class:'row'},f('o','GitHub username'),f('r','Repository'),f('b','Branch (main)'),f('t','Personal access token','password')),
      h('p',{class:'mut'},'Saved only in this browser. Token needs Contents: read and write on this repo.'),
      h('div',{class:'row'},h('button',{onclick:publish},'Publish '+pend+' change'+(pend==1?'':'s')),h('button',{class:'g',onclick:()=>{Object.entries(S.files).forEach(([p,t])=>dl(p,t));dl('subjects.json',JSON.stringify(S.cat,null,1))}},'Download files instead')),h('div',{id:'st',class:'mut'})),
    h('div',{class:'row'},h('h2',{class:'grow'},'Tests'),h('button',{class:'g s',onclick:()=>{const n=prompt('New class name');if(n){S.cat.classes.push({id:slug(n),name:n,subjects:[]});admin()}}},'Add class'),h('button',{onclick:()=>editor()},'New test')),
    allTests().length?allTests().map(({c,s,t})=>h('div',{class:'box row'},h('div',{class:'grow'},h('b',{},t.title),h('div',{class:'mut'},c.name+' · '+s.name)),
      h('input',{type:'number',min:1,value:t.duration,style:'width:80px',onchange:e=>{t.duration=+e.target.value||1;S.dirty=1;admin()}}),h('span',{class:'mut'},'min'),
      h('button',{class:'g s',onclick:()=>start(t)},'Preview'),
      h('button',{class:'r s',onclick:()=>{if(!confirm('Delete "'+t.title+'"?'))return;s.tests=s.tests.filter(x=>x!==t);if(S.files[t.file])delete S.files[t.file];else S.del.push(t.file);admin()}},'Delete'))):h('p',{class:'mut'},'No tests yet. Create your first one.')
  )));
}
async function b64(s){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(new Blob([s]))})}
async function publish(){
  const g=LS.get('gh',{}),st=document.getElementById('st');if(!g.o||!g.r||!g.t){st.textContent='Fill in username, repository and token first.';return}
  const br=g.b||'main',api=p=>`https://api.github.com/repos/${g.o}/${g.r}/contents/${p}`,H={Authorization:'Bearer '+g.t,Accept:'application/vnd.github+json'};
  const sh=async p=>{const r=await fetch(api(p)+'?ref='+br+'&t='+Date.now(),{headers:H});return r.ok?(await r.json()).sha:undefined};
  try{
    const put=async(p,txt)=>{st.textContent='Uploading '+p+'…';const r=await fetch(api(p),{method:'PUT',headers:H,body:JSON.stringify({message:'Update '+p,content:await b64(txt),branch:br,sha:await sh(p)})});if(!r.ok)throw new Error(p+': '+(await r.json()).message)};
    for(const [p,t] of Object.entries(S.files))await put(p,t);
    for(const p of S.del){const s=await sh(p);if(s)await fetch(api(p),{method:'DELETE',headers:H,body:JSON.stringify({message:'Delete '+p,sha:s,branch:br})})}
    await put(CFG.INDEX,JSON.stringify(S.cat,null,1));
    S.files={};S.del=[];S.dirty=0;st.textContent='Published. Students see it after GitHub Pages rebuilds (about a minute).';
  }catch(e){st.textContent='Failed: '+e.message}
}
const img=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};i.src=URL.createObjectURL(f)});
const newQ=()=>({q:'',qi:'',o:['','','',''],oi:['','','',''],a:0});
function editor(T){
  T=T||{title:'',cls:S.cat.classes[0].id,subject:'',duration:30,marks:4,neg:1,questions:[newQ()]};
  const inp=(k,ty)=>h('input',{type:ty||'text',value:T[k],oninput:e=>T[k]=ty=='number'?+e.target.value:e.target.value});
  const fileIn=(set)=>h('input',{type:'file',accept:'image/*',onchange:async e=>{if(e.target.files[0]){set(await img(e.target.files[0]));editor(T)}}});
  const thumb=src=>src?h('div',{class:'pv'},h('img',{src})):null;
  go(h('div',{},top('New test'),h('div',{class:'wrap'},h('h2',{},'Test details'),
    h('div',{class:'box'},h('label',{class:'f'},'Title'),inp('title'),
      h('label',{class:'f'},'Class'),h('select',{onchange:e=>T.cls=e.target.value},S.cat.classes.map(c=>h('option',{value:c.id,selected:c.id==T.cls},c.name))),
      h('label',{class:'f'},'Subject'),h('input',{list:'sj',value:T.subject,oninput:e=>T.subject=e.target.value}),h('datalist',{id:'sj'},[...new Set(S.cat.classes.flatMap(c=>c.subjects.map(s=>s.name)))].map(n=>h('option',{value:n}))),
      h('div',{class:'row'},h('div',{class:'grow'},h('label',{class:'f'},'Time (minutes)'),inp('duration','number')),h('div',{class:'grow'},h('label',{class:'f'},'Marks per correct'),inp('marks','number')),h('div',{class:'grow'},h('label',{class:'f'},'Negative per wrong'),inp('neg','number')))),
    h('h2',{},'Questions'),h('p',{class:'mut'},'Write LaTeX between $ signs, e.g. $\\frac{1}{2}mv^2$. Add an image if needed.'),
    T.questions.map((q,k)=>{const pv=h('div',{class:'pv'},q.q);return h('div',{class:'box'},h('div',{class:'row'},h('b',{class:'grow'},'Question '+(k+1)),h('button',{class:'r s',onclick:()=>{if(T.questions.length>1){T.questions.splice(k,1);editor(T)}}},'Remove')),
      h('textarea',{value:q.q,oninput:e=>{q.q=e.target.value;pv.textContent=q.q;mj(pv)}}),pv,fileIn(d=>q.qi=d),thumb(q.qi),
      q.o.map((o,j)=>{const pj=h('div',{class:'pv'},o);return h('div',{style:'margin-top:10px'},h('div',{class:'row'},h('input',{type:'radio',name:'a'+k,checked:q.a==j,style:'width:auto',onchange:()=>q.a=j}),h('b',{},'ABCD'[j]),h('div',{class:'grow'},h('input',{value:o,placeholder:'Option text or LaTeX',oninput:e=>{q.o[j]=e.target.value;pj.textContent=q.o[j];mj(pj)}}))),pj,fileIn(d=>q.oi[j]=d),thumb(q.oi[j]))}),
      h('p',{class:'mut'},'Select the round button next to the correct option.'))}),
    h('div',{class:'row'},h('button',{class:'g',onclick:()=>{T.questions.push(newQ());editor(T)}},'Add question'),h('button',{onclick:()=>saveTest(T)},'Save test'),h('button',{class:'g',onclick:admin},'Cancel'))
  )));
  setTimeout(()=>mj(root),0);
}
function saveTest(T){
  if(!T.title.trim()||!T.subject.trim())return alert('Add a title and subject.');
  for(const q of T.questions){if(!q.q.trim()&&!q.qi)return alert('Every question needs text or an image.');if(q.o.some((o,j)=>!o.trim()&&!q.oi[j]))return alert('Every option needs text or an image.')}
  const id=slug(T.title)+'-'+Date.now().toString(36),file='tests/'+id+'.json';
  const clean=T.questions.map(q=>({q:q.q,qi:q.qi||undefined,o:q.o,oi:q.oi.some(x=>x)?q.oi:undefined,a:q.a}));
  S.files[file]=JSON.stringify({title:T.title,marks:T.marks,neg:T.neg,questions:clean});
  const c=S.cat.classes.find(x=>x.id==T.cls);let s=c.subjects.find(x=>x.name.toLowerCase()==T.subject.trim().toLowerCase());
  if(!s){s={name:T.subject.trim(),tests:[]};c.subjects.push(s)}
  s.tests.push({id,title:T.title,file,duration:T.duration||30});admin();
}
init();
</script></body></html>
